<svg width="1100" height="640" viewBox="0 0 1100 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mock-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0f1629"/>
    </linearGradient>
    <linearGradient id="mock-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="m-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      .m-brand { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: -0.02em; }
      .m-nav { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; font-weight: 500; fill: #94a3b8; }
      .m-heading { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 32px; font-weight: 800; fill: #ffffff; letter-spacing: -0.03em; }
      .m-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; fill: #94a3b8; }
      .m-mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
      .m-card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; font-weight: 700; fill: #f8fafc; }
      .m-btn { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Browser Frame Wrapper -->
  <rect width="1100" height="640" rx="16" fill="url(#mock-bg)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Browser Title Bar -->
  <g transform="translate(0, 0)">
    <rect width="1100" height="42" rx="16" fill="#080b14" fill-opacity="0.8"/>
    <!-- Window controls -->
    <circle cx="28" cy="21" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="46" cy="21" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="64" cy="21" r="5" fill="#22c55e" fill-opacity="0.8"/>

    <!-- URL Bar -->
    <rect x="280" y="8" width="540" height="26" rx="6" fill="#13192a" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="550" y="25" text-anchor="middle" font-family="'JetBrains Mono'" font-size="11.5" fill="#94a3b8">
      🔒 https://dayform-live.vercel.app
    </text>
  </g>

  <!-- Top Navigation Inside App -->
  <g transform="translate(48, 62)">
    <text x="0" y="20" class="m-brand">DAYFORM</text>
    <text x="110" y="20" class="m-nav">Live Itinerary</text>
    <text x="210" y="20" class="m-nav">How It Works</text>
    <text x="310" y="20" class="m-nav">Intelligence</text>

    <!-- Status Pill -->
    <rect x="760" y="2" width="240" height="26" rx="13" fill="#062e1f" stroke="#10b981" stroke-opacity="0.3"/>
    <circle cx="776" cy="15" r="4" fill="#10b981"/>
    <text x="788" y="19" class="m-mono" font-size="11" font-weight="600" fill="#10b981">PLANNING ENGINE ONLINE</text>
  </g>

  <!-- Hero Headline Inside App -->
  <g transform="translate(48, 126)">
    <text x="0" y="24" class="m-heading">Give shape to your day.</text>
    <text x="0" y="48" class="m-sub">Tell me what you want to do. I’ll figure out the rest.</text>

    <!-- Intention Input Bar -->
    <g transform="translate(0, 68)">
      <rect width="1004" height="52" rx="10" fill="#101728" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
      <text x="20" y="32" class="m-mono" fill="#f8fafc" font-size="13">“Plan a birthday day out in Cape Town for 4 people under R2,000, starting after lunch.”</text>
      <rect x="880" y="8" width="112" height="36" rx="6" fill="#38bdf8"/>
      <text x="936" y="31" text-anchor="middle" class="m-btn" fill="#041224">REPLAN ↵</text>
    </g>

    <!-- Extracted Context Tags -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="130" height="24" rx="12" fill="#0e2338"/>
      <text x="65" y="16" text-anchor="middle" class="m-mono" font-size="11" fill="#38bdf8">👥 4 Guests</text>

      <rect x="140" y="0" width="145" height="24" rx="12" fill="#0e2338"/>
      <text x="212" y="16" text-anchor="middle" class="m-mono" font-size="11" fill="#38bdf8">💰 R2,000 Ceiling</text>

      <rect x="295" y="0" width="155" height="24" rx="12" fill="#0e2338"/>
      <text x="372" y="16" text-anchor="middle" class="m-mono" font-size="11" fill="#38bdf8">⏰ 13:30 – 19:45</text>

      <rect x="460" y="0" width="145" height="24" rx="12" fill="#0e2338"/>
      <text x="532" y="16" text-anchor="middle" class="m-mono" font-size="11" fill="#38bdf8">📍 Cape Town</text>

      <rect x="615" y="0" width="155" height="24" rx="12" fill="#162238"/>
      <text x="692" y="16" text-anchor="middle" class="m-mono" font-size="11" fill="#818cf8">🎉 Birthday Mode</text>
    </g>

    <!-- Itinerary Card 1 -->
    <g transform="translate(0, 178)">
      <rect width="1004" height="66" rx="10" fill="#0e1526" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="32" cy="33" r="14" fill="#0284c7"/>
      <text x="32" y="37" text-anchor="middle" class="m-mono" font-size="11" font-weight="700" fill="#ffffff">01</text>
      <text x="64" y="27" class="m-mono" fill="#38bdf8" font-size="11.5">13:30 – 15:00 · 90m Dwell</text>
      <text x="64" y="48" class="m-card-title">Truth Coffee Roasting</text>
      <text x="235" y="48" class="m-sub">· Buitenkant St · Artisanal Lunch &amp; Coffee · Est R680</text>
      <rect x="760" y="18" width="100" height="30" rx="6" fill="#152438"/>
      <text x="810" y="37" text-anchor="middle" class="m-btn" fill="#38bdf8">SWAP STOP</text>
      <rect x="872" y="18" width="118" height="30" rx="6" fill="#082e21"/>
      <text x="931" y="37" text-anchor="middle" class="m-btn" fill="#34d399">DIRECTIONS ↗</text>
    </g>

    <!-- Transit Indicator 1 -->
    <g transform="translate(0, 250)">
      <text x="64" y="12" class="m-mono" fill="#f59e0b" font-size="11">↓ 20m scenic transit buffer (Buitenkant St → Newlands)</text>
    </g>

    <!-- Itinerary Card 2 -->
    <g transform="translate(0, 270)">
      <rect width="1004" height="66" rx="10" fill="#0e1526" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="32" cy="33" r="14" fill="#4f46e5"/>
      <text x="32" y="37" text-anchor="middle" class="m-mono" font-size="11" font-weight="700" fill="#ffffff">02</text>
      <text x="64" y="27" class="m-mono" fill="#818cf8" font-size="11.5">15:20 – 17:15 · 115m Dwell</text>
      <text x="64" y="48" class="m-card-title">Kirstenbosch Botanical Gardens</text>
      <text x="310" y="48" class="m-sub">· Rhodes Dr · Scenic Canopy Walkway · R400 (4 tkts)</text>
      <rect x="760" y="18" width="100" height="30" rx="6" fill="#152438"/>
      <text x="810" y="37" text-anchor="middle" class="m-btn" fill="#38bdf8">SWAP STOP</text>
      <rect x="872" y="18" width="118" height="30" rx="6" fill="#082e21"/>
      <text x="931" y="37" text-anchor="middle" class="m-btn" fill="#34d399">DIRECTIONS ↗</text>
    </g>

    <!-- Bottom Budget & Execution Footer Bar -->
    <g transform="translate(0, 350)">
      <rect width="1004" height="48" rx="8" fill="#072218" stroke="#10b981" stroke-opacity="0.35"/>
      <text x="24" y="29" class="m-mono" fill="#34d399" font-size="12" font-weight="700">TOTAL: R1,650</text>
      <text x="140" y="29" class="m-sub" fill="#cbd5e1">|  Remaining Headroom: R350 under R2,000 budget</text>
      <rect x="850" y="9" width="140" height="30" rx="6" fill="#059669"/>
      <text x="920" y="28" text-anchor="middle" class="m-btn" fill="#ffffff">EXPORT .ICS 📅</text>
    </g>
  </g>
</svg>
