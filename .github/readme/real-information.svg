<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="info-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e19"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      .i-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .i-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11.5px; fill: #94a3b8; }
      .i-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1000" height="260" rx="14" fill="url(#info-bg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Level 1: Live Provider Data -->
  <g transform="translate(40, 24)">
    <rect width="920" height="46" rx="8" fill="#0f1f33" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="10" fill="#0284c7"/>
    <text x="28" y="27" text-anchor="middle" font-family="'JetBrains Mono'" font-size="11" font-weight="700" fill="#ffffff">1</text>
    <text x="56" y="27" class="i-title">LIVE PROVIDER DATA</text>
    <text x="320" y="27" class="i-sub">OpenStreetMap Overpass API (spatial venues) &amp; Open-Meteo (hourly precipitation alerts)</text>
    <rect x="800" y="12" width="100" height="22" rx="11" fill="#0369a1"/>
    <text x="850" y="26" text-anchor="middle" class="i-badge" fill="#e0f2fe">REAL-TIME</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M500 72L500 80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Level 2: Session-Cached Real Data -->
  <g transform="translate(40, 82)">
    <rect width="920" height="46" rx="8" fill="#131c36" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="10" fill="#4f46e5"/>
    <text x="28" y="27" text-anchor="middle" font-family="'JetBrains Mono'" font-size="11" font-weight="700" fill="#ffffff">2</text>
    <text x="56" y="27" class="i-title">SESSION-CACHED REAL DATA</text>
    <text x="320" y="27" class="i-sub">Redis ephemeral cache prevents rate-limit saturation and preserves session consistency</text>
    <rect x="800" y="12" width="100" height="22" rx="11" fill="#3730a3"/>
    <text x="850" y="26" text-anchor="middle" class="i-badge" fill="#e0e7ff">15M TTL</text>
  </g>

  <!-- Down Arrow 2 -->
  <path d="M500 130L500 138" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>

  <!-- Level 3: Verified Real-World Catalog -->
  <g transform="translate(40, 140)">
    <rect width="920" height="46" rx="8" fill="#1c1833" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="10" fill="#9333ea"/>
    <text x="28" y="27" text-anchor="middle" font-family="'JetBrains Mono'" font-size="11" font-weight="700" fill="#ffffff">3</text>
    <text x="56" y="27" class="i-title">VERIFIED REAL CATALOG</text>
    <text x="320" y="27" class="i-sub">Pre-verified authentic local establishments used when network partitions occur</text>
    <rect x="800" y="12" width="100" height="22" rx="11" fill="#581c87"/>
    <text x="850" y="26" text-anchor="middle" class="i-badge" fill="#f3e8ff">DETERMINISTIC</text>
  </g>

  <!-- Down Arrow 3 -->
  <path d="M500 188L500 196" stroke="#a855f7" stroke-width="2" stroke-linecap="round"/>

  <!-- Level 4: Honest Uncertainty & Empty State -->
  <g transform="translate(40, 198)">
    <rect width="920" height="46" rx="8" fill="#1f1418" stroke="#f43f5e" stroke-opacity="0.35" stroke-width="1.2"/>
    <circle cx="28" cy="23" r="10" fill="#e11d48"/>
    <text x="28" y="27" text-anchor="middle" font-family="'JetBrains Mono'" font-size="11" font-weight="700" fill="#ffffff">4</text>
    <text x="56" y="27" class="i-title">HONEST UNCERTAINTY</text>
    <text x="320" y="27" class="i-sub">Missing data is flagged as UNKNOWN · Never fabricates bookings, hours, or fake venues</text>
    <rect x="800" y="12" width="100" height="22" rx="11" fill="#881337"/>
    <text x="850" y="26" text-anchor="middle" class="i-badge" fill="#ffe4e6">ZERO FAKES</text>
  </g>
</svg>
