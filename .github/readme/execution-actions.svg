<svg width="1000" height="150" viewBox="0 0 1000 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="exec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      .ex-title { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 700; fill: #f8fafc; }
      .ex-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1000" height="150" rx="14" fill="url(#exec-bg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Action 1: Google Maps Routing -->
  <g transform="translate(30, 25)">
    <rect width="170" height="100" rx="8" fill="#11182c" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="16" y="32" font-size="18">📍</text>
    <text x="16" y="58" class="ex-title" fill="#38bdf8">DIRECTIONS</text>
    <text x="16" y="78" class="ex-desc">One-tap navigation</text>
    <text x="16" y="92" class="ex-desc">via Google Maps coordinates</text>
  </g>

  <!-- Action 2: Phone Calling -->
  <g transform="translate(220, 25)">
    <rect width="170" height="100" rx="8" fill="#11182c" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="16" y="32" font-size="18">📞</text>
    <text x="16" y="58" class="ex-title" fill="#60a5fa">DIRECT CALL</text>
    <text x="16" y="78" class="ex-desc">Instant phone dialer</text>
    <text x="16" y="92" class="ex-desc">for quick inquiries</text>
  </g>

  <!-- Action 3: Venue Website -->
  <g transform="translate(410, 25)">
    <rect width="170" height="100" rx="8" fill="#11182c" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="16" y="32" font-size="18">🌐</text>
    <text x="16" y="58" class="ex-title" fill="#818cf8">VISIT VENUE</text>
    <text x="16" y="78" class="ex-desc">Verified official menu</text>
    <text x="16" y="92" class="ex-desc">and booking portals</text>
  </g>

  <!-- Action 4: Calendar Export -->
  <g transform="translate(600, 25)">
    <rect width="170" height="100" rx="8" fill="#11182c" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2"/>
    <text x="16" y="32" font-size="18">📅</text>
    <text x="16" y="58" class="ex-title" fill="#c084fc">CALENDAR .ICS</text>
    <text x="16" y="78" class="ex-desc">Full schedule download</text>
    <text x="16" y="92" class="ex-desc">signed by Dayform</text>
  </g>

  <!-- Action 5: Complete Stop -->
  <g transform="translate(790, 25)">
    <rect width="180" height="100" rx="8" fill="#0f241a" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.2"/>
    <text x="16" y="32" font-size="18">✓</text>
    <text x="16" y="58" class="ex-title" fill="#34d399">MARK COMPLETE</text>
    <text x="16" y="78" class="ex-desc">Active progress tracking</text>
    <text x="16" y="92" class="ex-desc">as your outing unfolds</text>
  </g>
</svg>
