<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: 72px;
        font-weight: 700;
        letter-spacing: 14px;
        fill: white;
      }

      .subtitle {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: 18px;
        letter-spacing: 5px;
        fill: #a1a1aa;
      }

      .terminal {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: 17px;
        fill: #d4d4d8;
      }

      .accent {
        fill: #67e8f9;
      }

      .status {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
        font-size: 15px;
        letter-spacing: 2px;
        fill: #a1a1aa;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }

      .line1 {
        animation: reveal1 10s infinite;
      }

      .line2 {
        animation: reveal2 10s infinite;
      }

      .line3 {
        animation: reveal3 10s infinite;
      }

      .line4 {
        animation: reveal4 10s infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      @keyframes reveal1 {
        0%, 8% { opacity: 0; }
        12%, 100% { opacity: 1; }
      }

      @keyframes reveal2 {
        0%, 28% { opacity: 0; }
        32%, 100% { opacity: 1; }
      }

      @keyframes reveal3 {
        0%, 48% { opacity: 0; }
        52%, 100% { opacity: 1; }
      }

      @keyframes reveal4 {
        0%, 68% { opacity: 0; }
        72%, 100% { opacity: 1; }
      }

      .pulse {
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes pulse {
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>

  <rect x="1" y="1" width="1198" height="418" rx="18"
        fill="none" stroke="#27272a" stroke-width="2"/>

  <circle cx="34" cy="34" r="6" fill="#ef4444"/>
  <circle cx="56" cy="34" r="6" fill="#eab308"/>
  <circle cx="78" cy="34" r="6" fill="#22c55e"/>

  <text x="60" y="145" class="title">OpsOS</text>

  <rect x="62" y="165" width="310" height="2" fill="url(#accent)"/>

  <text x="62" y="202" class="subtitle">
    INTELLIGENT OPERATIONS SYSTEM
  </text>

  <text x="62" y="258" class="terminal line1">
    <tspan class="accent">&gt;</tspan> OBSERVING SYSTEMS
  </text>

  <text x="62" y="290" class="terminal line2">
    <tspan class="accent">&gt;</tspan> INVESTIGATING INCIDENTS
  </text>

  <text x="62" y="322" class="terminal line3">
    <tspan class="accent">&gt;</tspan> RECOMMENDING ACTIONS
  </text>

  <text x="62" y="354" class="terminal line4">
    <tspan class="accent">&gt;</tspan> AWAITING AUTHORISATION
    <tspan class="cursor accent">_</tspan>
  </text>

  <circle cx="1090" cy="352" r="7" fill="#22c55e" class="pulse" filter="url(#glow)"/>

  <text x="1110" y="357" class="status">CORE ONLINE</text>
</svg>

