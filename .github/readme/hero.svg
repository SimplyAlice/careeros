<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0e1422"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>

    <!-- Ambient Mesh Glows -->
    <radialGradient id="mesh1" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh2" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      .brand {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .tagline {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #94a3b8;
      }

      .promise {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 15px;
        font-style: italic;
        fill: #64748b;
      }

      .badge {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        fill: #38bdf8;
      }

      .status-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        fill: #10b981;
      }

      .terminal-header {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.08em;
        fill: #64748b;
      }

      .terminal-user {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #f1f5f9;
      }

      .terminal-step {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        font-weight: 400;
        fill: #cbd5e1;
      }

      .accent-symbol {
        fill: #38bdf8;
        font-weight: 700;
      }

      .dim {
        fill: #64748b;
      }

      .cursor {
        animation: blink 0.9s step-end infinite;
      }

      .type-line1 {
        animation: reveal1 12s infinite;
      }

      .type-line2 {
        animation: reveal2 12s infinite;
      }

      .type-line3 {
        animation: reveal3 12s infinite;
      }

      .type-line4 {
        animation: reveal4 12s infinite;
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes reveal1 {
        0%, 3% { opacity: 0; }
        6%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes reveal2 {
        0%, 26% { opacity: 0; }
        30%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes reveal3 {
        0%, 50% { opacity: 0; }
        54%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      @keyframes reveal4 {
        0%, 74% { opacity: 0; }
        78%, 96% { opacity: 1; }
        100% { opacity: 0; }
      }

      .pulse {
        animation: pulseDot 2s ease-in-out infinite;
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.92); }
      }
    </style>
  </defs>

  <!-- Canvas Outer & Mesh Background -->
  <rect width="1200" height="480" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="16" fill="url(#mesh1)"/>
  <rect width="1200" height="480" rx="16" fill="url(#mesh2)"/>

  <!-- Subtle Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="478" rx="15" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Header Category Badge (Left) -->
  <g transform="translate(60, 42)">
    <rect width="280" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <text x="26" y="17" class="badge">INTELLIGENT REAL-WORLD PLANNING</text>
  </g>

  <!-- Live Status Pill (Right) -->
  <g transform="translate(890, 42)">
    <rect width="250" height="26" rx="13" fill="#062d1f" fill-opacity="0.7" stroke="#10b981" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981" class="pulse" filter="url(#glow)"/>
    <text x="26" y="17" class="status-label">PLANNING ENGINE ONLINE</text>
  </g>

  <!-- Wordmark & Editorial Tagline -->
  <text x="60" y="132" class="brand" fill="url(#title-grad)">DAYFORM</text>
  <rect x="62" y="146" width="220" height="2.5" fill="url(#accent)"/>
  <text x="60" y="180" class="tagline">Give shape to your day.</text>
  <text x="60" y="206" class="promise">“Tell me what you want to do. I’ll figure out the rest.”</text>

  <!-- Typewriter / Filter Interactive Stage Window (Bottom) -->
  <g transform="translate(60, 236)">
    <!-- Stage Window Box -->
    <rect width="1080" height="204" rx="12" fill="#090d16" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

    <!-- Mac Style Window Dots -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="42" cy="22" r="5" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="60" cy="22" r="5" fill="#22c55e" fill-opacity="0.8"/>

    <text x="84" y="26" class="terminal-header">dayform-planning-session --intent "Cape Town Birthday" --budget R2000</text>
    <line x1="0" y1="40" x2="1080" y2="40" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Prompt Input Line -->
    <g transform="translate(24, 68)">
      <text class="terminal-user">
        <tspan class="accent-symbol">&gt; INTENT:</tspan> “I want a cute birthday day out in Cape Town for four people, under R2,000, starting after lunch.”
      </text>
    </g>

    <!-- Step 1: Understanding -->
    <g transform="translate(24, 100)" class="type-line1">
      <text class="terminal-step">
        <tspan class="dim">[01:UNDERSTAND]</tspan> 4 guests · R2,000 ceiling · afternoon window (13:30–20:00) · Cape Town · occasion: birthday
      </text>
    </g>

    <!-- Step 2: Research -->
    <g transform="translate(24, 130)" class="type-line2">
      <text class="terminal-step">
        <tspan class="dim">[02:RESEARCH  ]</tspan> Discovered 28 eligible venues via OpenStreetMap &amp; Overpass spatial index (hours &amp; locations verified)
      </text>
    </g>

    <!-- Step 3: Plan Synthesis -->
    <g transform="translate(24, 160)" class="type-line3">
      <text class="terminal-step">
        <tspan class="dim">[03:SYNTHESIS ]</tspan> 4 stops sequenced with 25m transit buffers · Total R1,650 · R350 headroom remaining
      </text>
    </g>

    <!-- Step 4: Execution Ready -->
    <g transform="translate(24, 190)" class="type-line4">
      <text class="terminal-step">
        <tspan class="dim">[04:EXECUTION ]</tspan> Google Maps directions ready · venue reservation handoff prepared · calendar .ics ready
        <tspan class="cursor accent-symbol">_</tspan>
      </text>
    </g>
  </g>
</svg>
