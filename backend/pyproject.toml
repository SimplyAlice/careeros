[project]
name = "careeros-backend"
version = "0.1.0"
description = "CareerOS backend — AI-powered career operations platform."
requires-python = ">=3.13"

# Dependency versions are pinned in requirements.txt / requirements-dev.txt
# rather than here — this file's [project] table exists to give tools
# (ruff, black, pytest) a project root and Python-version context, not to
# manage installs. See ADR discussion in `docs/adr/` for the reasoning
# behind the overall tech stack.

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — flags outdated syntax for the target Python version
    "B",   # flake8-bugbear — common bug patterns
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async — catches blocking calls in async code
]
ignore = [
    "E501", # line length is enforced by black/ruff-format instead
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.black]
line-length = 110
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
env = [
    "D:ENVIRONMENT=testing",
    "D:SECRET_KEY=test-secret-key-do-not-use-in-production",
    "D:DATABASE_URL=postgresql+asyncpg://careeros:careeros@postgres:5432/careeros_test",
    "D:REDIS_URL=redis://redis:6379/1",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
